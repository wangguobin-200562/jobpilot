[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "1.0.0"
description = "An AI-powered job search copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.26,<2.0",
    "openai>=2.0,<3.0",
    "playwright>=1.50,<2.0",
    "pydantic>=2.10,<3.0",
    "python-docx>=1.2,<2.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit==1.63.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
