<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>JobPilot</title>
    <style>
      body { width: 320px; margin: 0; padding: 18px; color: #172033; font: 14px/1.5 system-ui, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      p { margin: 0 0 14px; color: #667085; }
      label { display: block; margin: 12px 0 5px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #d0d5dd; border-radius: 6px; }
      button { margin-top: 10px; width: 100%; padding: 9px; border: 1px solid #2563eb; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
      button.secondary { background: white; color: #2563eb; }
      #status { margin-top: 12px; min-height: 20px; color: #344054; }
    </style>
  </head>
  <body>
    <h1>JobPilot</h1>
    <p>只读取岗位，或对你已在 JobPilot 确认的 BOSS 岗位发起初始沟通。不发送简历。</p>
    <button id="capture">开启连续采集</button>
    <button id="pause" class="secondary">暂停采集</button>
    <button id="clear" class="secondary">清空已读取岗位</button>
    <label for="token">本地连接令牌</label>
    <input id="token" type="password" autocomplete="off" placeholder="从 JobPilot 页面复制">
    <button id="send">连接并同步到 JobPilot</button>
    <button id="stop-apply" class="secondary">停止本次沟通</button>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
